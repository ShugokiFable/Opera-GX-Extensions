name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-syntax:
    name: JavaScript syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: node --check every .js file
        run: |
          find extensions sources tools -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n 1 node --check

  nexus-research-ts:
    name: nexus-research-ts build + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sources/nexus-research-ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Install, build, typecheck
        run: |
          # Lockfile was generated against a private npm mirror; rewrite so runners can fetch.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("package-lock.json")
          t = p.read_text(encoding="utf-8")
          old = "https://packages.applied-caas-gateway1.internal.api.openai.org/artifactory/api/npm/npm-public/"
          t2 = t.replace(old, "https://registry.npmjs.org/")
          if t2 != t:
              p.write_text(t2, encoding="utf-8")
              print("rewrote package-lock.json resolved URLs to registry.npmjs.org")
          else:
              print("package-lock.json already uses a public registry")
          PY
          npm ci --registry https://registry.npmjs.org/
          npm run build --if-present
          if [ -x node_modules/.bin/tsc ]; then
            node_modules/.bin/tsc --noEmit
          else
            echo "typescript not a dependency; skipping tsc --noEmit"
          fi

  tests:
    name: Extension test suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run every bundled test, validator and self-check
        run: |
          set -e
          found=0
          while IFS= read -r script; do
            found=$((found + 1))
            echo "::group::$script"
            node "$script"
            echo "::endgroup::"
          done < <(find extensions -type f \
              \( -path '*/tests/*' -o -name '*test*.mjs' -o -name '*selfcheck*.mjs' \
                 -o -name 'validate.mjs' -o -name 'self_test.mjs' \) \
              \( -name '*.mjs' -o -name '*.cjs' \) \
              -not -path '*/node_modules/*' | sort)
          echo "ran $found suites"
          test "$found" -gt 0

  version-sync:
    name: Manifest versions match the README table
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node tools/check-versions.mjs
